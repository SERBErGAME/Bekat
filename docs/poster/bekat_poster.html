<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Bekat poster A3</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --ink: #15171C; --ink2: #5B6270; --ink3: #9AA1AE;
    --night: #1E2024; --blue: #2D6BF0; --line: #E3E7EE;
    --r1: #E53935; --r2: #1E6FE8; --r3: #22A55B; --r5: #F59E0B; --r7: #8B5CF6; --r9: #06B6D4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: "Inter", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .board { width: 1782px; height: 1260px; padding: 26px 30px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }

  header { display: flex; align-items: center; gap: 22px; height: 128px; }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  .badges { display: flex; gap: 7px; }
  .b { width: 30px; height: 30px; border-radius: 9px; color: #fff; font-weight: 800; font-size: 16px; display: grid; place-items: center; }
  .title { display: flex; align-items: baseline; gap: 18px; }
  .title h1 { font-size: 84px; font-weight: 900; letter-spacing: -3.5px; line-height: .9; }
  .title p { font-size: 25px; font-weight: 600; color: var(--ink2); letter-spacing: -.3px; }
  .busart { height: 118px; margin-left: 4px; }
  .org { margin-left: auto; display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: 24px; padding: 14px 20px 14px 14px; }
  .org img { width: 92px; height: 92px; border-radius: 50%; }
  .org b { display: block; font-size: 21px; font-weight: 800; }
  .org span { display: block; font-size: 14.5px; color: var(--ink2); font-weight: 600; margin-top: 3px; }

  .card { background: var(--card); border-radius: 26px; padding: 20px 22px; position: relative; overflow: hidden; }
  .label { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; color: var(--ink2); text-transform: uppercase; margin-bottom: 10px; }
  .label .b { width: 26px; height: 26px; border-radius: 8px; font-size: 13px; letter-spacing: 0; }
  h2 { font-size: 26px; font-weight: 800; letter-spacing: -.6px; line-height: 1.12; margin-bottom: 12px; }
  .txt { font-size: 15.5px; line-height: 1.42; color: var(--ink2); font-weight: 500; }
  .txt b { color: var(--ink); font-weight: 700; }

  .row1 { display: grid; grid-template-columns: 455px 1fr 520px; gap: 16px; height: 606px; }
  .row2 { display: grid; grid-template-columns: 1.05fr .85fr 1fr 1.1fr; gap: 16px; height: 392px; }

  /* problem */
  ul.pts { list-style: none; display: flex; flex-direction: column; gap: 7px; margin: 2px 0 14px; }
  ul.pts li { font-size: 16px; line-height: 1.35; padding-left: 26px; position: relative; color: var(--ink); font-weight: 500; }
  ul.pts li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 11px; height: 11px; border-radius: 50%; border: 3px solid var(--r1); background: #fff; }
  .q { background: var(--night); color: #fff; border-radius: 18px; padding: 12px 18px; font-size: 17.5px; font-weight: 700; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--bg); border-radius: 18px; padding: 14px 16px; }
  .stat b { display: block; font-size: 34px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; }
  .stat span { display: block; font-size: 13.5px; color: var(--ink2); margin-top: 6px; font-weight: 600; line-height: 1.25; }
  .stat.dark { background: var(--night); } .stat.dark b { color: #7CE0A3; } .stat.dark span { color: #D6DAE2; }
  .src { font-size: 11px; color: var(--ink3); margin-top: 10px; line-height: 1.35; font-style: italic; }

  /* hero */
  .hero { padding: 0; background: #E9EDF3; }
  .hero > img.map { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 45% 40%; }
  .hero .shade { position: absolute; left: 0; right: 0; top: 0; height: 230px; background: linear-gradient(#FFFFFF 0%, #FFFFFFF2 55%, #FFFFFF00 100%); }
  .hero .head { position: absolute; left: 24px; top: 20px; right: 24px; }
  .phones { position: absolute; left: 0; right: 0; bottom: -78px; display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
  .phones img { width: 232px; filter: drop-shadow(0 18px 30px rgba(20,30,60,.25)); }
  .phones img:nth-child(2) { width: 262px; margin-bottom: 14px; }
  .chips { position: absolute; left: 24px; top: 124px; display: flex; gap: 8px; z-index: 2; }
  .chip { background: #fff; border-radius: 16px; padding: 8px 13px; font-size: 14.5px; font-weight: 700; box-shadow: 0 8px 24px rgba(27,36,64,.12); display: flex; gap: 8px; align-items: center; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* scheme */
  .scheme img { width: 100%; display: block; margin: -4px 0 6px; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .legend .b { width: 24px; height: 24px; border-radius: 7px; font-size: 12.5px; flex: none; }
  .legend em { font-style: normal; color: var(--ink3); font-weight: 600; font-size: 12px; }
  .legend .ok { color: var(--r3); }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 6px; position: relative; }
  .steps::before { content: ""; position: absolute; left: 30px; right: 30px; top: 21px; height: 5px; background: var(--r3); border-radius: 3px; }
  .step { position: relative; text-align: center; }
  .step .dot { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); margin: 0 auto 10px; display: grid; place-items: center; font-weight: 900; font-size: 18px; }
  .step b { display: block; font-size: 15.5px; margin-bottom: 4px; }
  .step span { font-size: 12.5px; color: var(--ink2); line-height: 1.3; display: block; }
  .algo { margin-top: 12px; background: var(--bg); border-radius: 16px; padding: 10px 14px; font-size: 13.5px; line-height: 1.4; color: var(--ink2); }
  .algo b { color: var(--ink); }

  /* tech */
  .stack { display: flex; flex-direction: column; gap: 7px; }
  .layer { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border-radius: 14px; padding: 8px 12px; }
  .layer .b { width: 26px; height: 26px; border-radius: 8px; flex: none; font-size: 12px; }
  .layer b { display: block; font-size: 14.5px; }
  .layer span { font-size: 12.5px; color: var(--ink2); line-height: 1.28; display: block; }
  .flutter { margin-top: 10px; background: var(--night); color: #fff; border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; text-align: center; }

  /* table */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th, td { padding: 8px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 12.5px; color: var(--ink2); font-weight: 700; }
  th.me, td.me { background: #E6EEFE; font-weight: 800; color: var(--ink); }
  th.me { background: var(--blue); color: #fff; border-radius: 10px 10px 0 0; }
  td:first-child { font-weight: 600; color: var(--ink); }
  td { color: var(--ink2); }

  /* plan */
  .money { display: flex; gap: 10px; margin-bottom: 12px; }
  .money div { flex: 1; background: var(--bg); border-radius: 16px; padding: 10px 14px; }
  .money b { display: block; font-size: 26px; font-weight: 900; letter-spacing: -1px; }
  .money span { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
  .tl { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 4px 0 10px; }
  .tl::before { content: ""; position: absolute; left: 16px; right: 16px; top: 9px; height: 4px; background: var(--r7); border-radius: 2px; }
  .tl div { position: relative; text-align: center; font-size: 11.5px; color: var(--ink2); line-height: 1.25; }
  .tl div::before { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); margin: 1px auto 6px; }
  .tl b { display: block; color: var(--ink); font-size: 12.5px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpis div { background: var(--bg); border-radius: 14px; padding: 8px 10px; }
  .kpis b { display: block; font-size: 20px; font-weight: 900; color: var(--blue); }
  .kpis span { font-size: 11.5px; color: var(--ink2); line-height: 1.25; display: block; }

  footer { margin-top: auto; height: 50px; margin-left: -30px; margin-right: -30px; padding: 0 30px; background: var(--night); color: #D6DAE2; display: flex; align-items: center; gap: 26px; font-size: 14px; }
  footer b { color: #fff; }
  footer .line { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  footer .line i { width: 34px; height: 6px; border-radius: 3px; display: inline-block; }
</style>
</head>

<div class="board">

  <footer>

  </footer>
</div>

const ROUTES = [["1","r1"],["2","r2"],["3","r3"],["5","r5"],["7","r7"],["9","r9"]];

document.getElementById("stats").innerHTML = L.stats.map(([v, s], i) => `<div class="stat ${i === 3 ? "dark" : ""}"><b>${v}</b><span>${s}</span></div>`).join("");
document.getElementById("chips").innerHTML = L.chips.map(([c, t]) => `<div class="chip"><i style="background:var(--${c})"></i>${t}</div>`).join("");
document.getElementById("legend").innerHTML = ROUTES.map(([id, c]) => `<div>${badge(id, c)}<span>${L.names[id]} <em class="${["5","7","9"].includes(id) ? "" : "ok"}">· ${["5","7","9"].includes(id) ? L.demo : L.real}</em></span></div>`).join("");
document.getElementById("steps").innerHTML = L.steps.map(([h, s], i) => `<div class="step"><div class="dot">${i + 1}</div><b>${h}</b><span>${s}</span></div>`).join("");
document.getElementById("stack").innerHTML = L.stack.map(([c, h, s]) => `<div class="layer"><span class="b" style="background:var(--${c})"></span><div><b>${h}</b><span>${s}</span></div></div>`).join("");
document.getElementById("tbl").innerHTML = L.tbl.map((r, ri) => `<tr>${r.map((c, ci) => ri === 0 ? `<th class="${ci === 3 ? "me" : ""}">${c}</th>` : `<td class="${ci === 3 ? "me" : ""}">${c}</td>`).join("")}</tr>`).join("");
document.getElementById("money").innerHTML = L.money.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("");
document.getElementById("tl").innerHTML = L.tl.map(([b, s]) => `<div><b>${b}</b>${s}</div>`).join("");
document.getElementById("kpis").innerHTML = L.kpis.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("");
</script>
</body>
</html>
